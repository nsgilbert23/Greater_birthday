<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎆 Happy New Year 🎆</title>

<style>
:root {
  --bg1:#140f2d;
  --bg2:#2b1055;
  --accent:#ffcc70;
  --text:#ffffff;
  --green:#9effa1;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  min-height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
}

.wrapper {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.card {
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,0.08);
  border-radius:22px;
  padding:26px 22px;
  text-align:center;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

h1 {
  font-size:1.8rem;
  margin-bottom:8px;
  color:var(--accent);
}

.sub {
  font-size:0.95rem;
  opacity:0.85;
  margin-bottom:14px;
}

.countdown {
  font-size:1.4rem;
  font-weight:700;
  margin-bottom:18px;
  color:var(--accent);
}

.btn {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,0.12);
  color:white;
  font-size:1rem;
}

.btn:disabled { opacity:.6; }

.surprise {
  margin-top:20px;
  font-size:1.7rem;
  font-weight:700;
  opacity:0;
  transform:scale(.6);
  transition:.7s;
  color:var(--accent);
}

.surprise.show {
  opacity:1;
  transform:scale(1);
}

.message {
  margin-top:14px;
  font-size:1.05rem;
  color:var(--green);
  opacity:0;
  transition:1s;
}

.message.show {
  opacity:1;
  animation:glow 1.6s infinite alternate;
}

@keyframes glow {
  from { text-shadow:0 0 6px var(--green); }
  to { text-shadow:0 0 16px var(--green); }
}

/* ECARD */
.ecard {
  margin-top:22px;
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,0.1);
  display:none;
}

.ecard h3 {
  margin-bottom:6px;
  color:#ffe9b3;
}

.gallery {
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
}

.gallery img {
  flex:0 0 85%;
  border-radius:14px;
  scroll-snap-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  cursor:pointer;
}

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
}

.modal img {
  max-width:95%;
  max-height:95%;
  border-radius:16px;
}

footer {
  margin-top:18px;
  font-size:.75rem;
  opacity:.7;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="card">

<h1>🎆 Happy New Year 🎆</h1>
<div class="sub">Wishing you joy, amahoro and happiness ✨</div>

<div class="countdown" id="count"></div>

<button class="btn" id="revealBtn">🎁 Open Surprise</button>

<div class="surprise" id="surprise">
Happy New Year, Anith Mukeshimana 🥂✨
</div>

<div class="message" id="message">
From my heart 💖  
May this year bring love, peace (amahoro) and many smiles 🌟
</div>

<!-- ✅ IMAGES KEPT EXACTLY AS YOU ADDED -->
<div class="ecard" id="ecard">
  <h3>💖 Your Special E-Card 💖</h3>
  <div class="gallery">
    <img src="image/nsgth.jpg">
    <img src="image/anith.jpeg">
    <img src="image/ani.jpeg">
    <img src="image/gibz.jpeg">
  </div>
</div>


<footer>Umwaka Mushya Mwiza 🎇</footer>

</div>
</div>

<div class="modal" id="modal"><img id="modalImg"></div>

<script>
/* 🔒 FIXED TARGET DATE */
const TARGET_DATE = new Date("2025-01-01T00:00:00");

const count = document.getElementById("count");
const revealBtn = document.getElementById("revealBtn");
const surprise = document.getElementById("surprise");
const message = document.getElementById("message");
const ecard = document.getElementById("ecard");

let revealed = false;

function reveal() {
  if (revealed) return;
  revealed = true;

  count.textContent = "🎆 Happy New Year 🎆";
  surprise.classList.add("show");
  message.classList.add("show");
  ecard.style.display = "block";
  revealBtn.disabled = true;
  revealBtn.textContent = "🎉 Opened";
}

function tick() {
  const diff = TARGET_DATE - new Date();

  if (diff <= 0) {
    reveal();
    clearInterval(timer);
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;

  count.textContent = `${d}d ${h}h ${m}m ${s}s`;
}

revealBtn.onclick = reveal;

/* FULLSCREEN IMAGE VIEW */
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

document.querySelectorAll(".gallery img").forEach(img=>{
  img.onclick=()=>{
    modalImg.src = img.src;
    modal.style.display="flex";
  };
});
modal.onclick=()=>modal.style.display="none";

tick();
const timer = setInterval(tick,1000);
</script>

</body>
</html>
